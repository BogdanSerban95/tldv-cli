name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for npm provenance, which attests that this tarball was built from this repo.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm >= 11.5.1, the floor for trusted publishing; 22 still ships 10.x.
      # No dependency cache here on purpose: a poisoned cache would reach the published tarball.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Never publish something that does not pass its own checks.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Authenticated by OIDC against the trusted publisher configured on npmjs.com — no token
      # secret exists to leak. prepublishOnly runs the build; provenance needs id-token: write.
      - run: npm publish --provenance --access public
