name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for npm provenance, which attests that this tarball was built from this repo.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Never publish something that does not pass its own checks.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly runs the build; --provenance needs a public repo and id-token: write.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
